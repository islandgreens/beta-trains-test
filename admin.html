<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Beta Train — entry manager (private)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: #1b1d22; color: #e8e8ea;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 900px; margin: 0 auto;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .note { color: #9a9ba3; font-size: 13px; margin: 0 0 24px; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    background: #2b2e36; color: #e8e8ea; border: 1px solid #40434e;
    border-radius: 6px; padding: 8px 14px;
  }
  button:hover { background: #383c46; }
  button.primary { background: #3d6bd6; border-color: #3d6bd6; }
  button.primary:hover { background: #4a78e0; }
  button.danger { background: #7a2b2b; border-color: #7a2b2b; }
  button.danger:hover { background: #8f3232; }

  .entry-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #24262c; border: 1px solid #34363e; border-radius: 8px;
    padding: 12px 14px; margin-bottom: 8px;
  }
  .entry-row__info { display: flex; flex-direction: column; gap: 3px; }
  .entry-row__title { font-weight: 600; font-size: 14px; }
  .entry-row__meta { font-size: 12px; color: #9a9ba3; font-family: monospace; }
  .status-badge {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 7px; border-radius: 999px; margin-left: 6px;
  }
  .status-upcoming { background: #3a3c44; }
  .status-signup-open { background: #2f5a3d; }
  .status-missed-deadline { background: #5a4a2f; }
  .status-closed-beta { background: #3d5a7a; }
  .status-open-beta { background: #2f7a5a; }
  .status-concluded { background: #4a2f2f; }

  .review-badge {
    display: inline-block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 7px; border-radius: 999px; margin-left: 6px;
    background: #6e3a1f; color: #ffd9b0; border: 1px solid #a85a2c;
  }
  .review-badge--clean { background: transparent; color: #4d8a5c; border: 1px solid #2f5a3d; }
  .entry-row--needs-review { border-color: #a85a2c; }

  .review-fields {
    margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px;
  }
  .review-chip {
    font-family: monospace; font-size: 10.5px; color: #ffd9b0;
    background: rgba(168, 90, 44, 0.18); border: 1px solid rgba(168, 90, 44, 0.4);
    border-radius: 4px; padding: 1px 6px;
  }

  .review-check-group {
    display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;
    padding: 10px; background: #17181c; border-radius: 6px; border: 1px solid #40434e;
  }
  .review-check-group label {
    display: flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 400;
    color: #c4c5cb; font-family: monospace;
  }

  .entry-row__actions { display: flex; gap: 6px; }

  dialog {
    background: #24262c; color: #e8e8ea; border: 1px solid #40434e; border-radius: 10px;
    padding: 20px; width: min(560px, 92vw); max-height: 86vh; overflow-y: auto;
  }
  dialog::backdrop { background: rgba(0,0,0,0.6); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: #c4c5cb; }
  .field input[type="text"], .field input[type="date"], .field input[type="url"], .field select, .field textarea {
    width: 100%; padding: 8px 10px; background: #17181c; border: 1px solid #40434e;
    border-radius: 6px; color: #e8e8ea; font-family: inherit; font-size: 13px;
  }
  .field textarea { min-height: 60px; resize: vertical; }
  .checkbox-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .checkbox-row label { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 400; color: #e8e8ea; }
  .inline-check { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9a9ba3; margin-top: 4px; }
  .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .output-section { margin-top: 28px; padding-top: 20px; border-top: 1px solid #34363e; }
  textarea#output {
    width: 100%; height: 320px; background: #101114; color: #b8f0c0;
    border: 1px solid #34363e; border-radius: 8px; padding: 12px; font-family: monospace;
    font-size: 12px; margin-top: 10px;
  }
  .empty-state { color: #6a6b73; font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>

<h1>The Beta Train — entry manager</h1>
<p class="note">Private local tool. Edits happen only on this page, nothing saves automatically. Add, edit, or remove entries below, then generate the updated file and paste it over shared/data.js.</p>

<div class="toolbar">
  <button class="primary" id="add-btn">+ Add new entry</button>
  <button id="generate-btn">Generate updated data.js</button>
  <button id="sort-review-btn">Sort: needs review first</button>
</div>

<div id="entry-list"></div>

<div class="output-section" id="output-section" hidden>
  <div class="toolbar">
    <button class="primary" id="copy-btn">Copy to clipboard</button>
    <button id="download-btn">Download as data.js</button>
  </div>
  <textarea id="output" readonly></textarea>
</div>

<dialog id="entry-dialog">
  <h2 id="dialog-title" style="margin-top:0;">Add entry</h2>
  <form id="entry-form">
    <div class="field">
      <label>Title</label>
      <input type="text" id="f-title" required>
    </div>
    <div class="field">
      <label>ID (slug — auto-filled from title, edit if you want)</label>
      <input type="text" id="f-id" required>
    </div>
    <div class="field">
      <label>Platforms</label>
      <div class="checkbox-row">
        <label><input type="checkbox" id="f-platform-playstation" value="playstation"> PlayStation</label>
        <label><input type="checkbox" id="f-platform-xbox" value="xbox"> Xbox</label>
        <label><input type="checkbox" id="f-platform-pc" value="pc"> PC</label>
      </div>
    </div>
    <div class="field">
      <label>Platform access type (only matters if multiple platforms are checked)</label>
      <select id="f-access-type">
        <option value="unspecified">Unspecified</option>
        <option value="confirmed-simultaneous">Confirmed simultaneous</option>
        <option value="selection-during-signup">Selection during signup</option>
      </select>
    </div>
    <div class="two-col">
      <div class="field">
        <label>Signup opens</label>
        <input type="date" id="f-signup-open" required>
      </div>
      <div class="field">
        <label>Signup deadline</label>
        <input type="date" id="f-signup-deadline">
        <div class="inline-check">
          <input type="checkbox" id="f-no-deadline"><label for="f-no-deadline">No known deadline (rolling admission)</label>
        </div>
      </div>
    </div>
    <div class="two-col">
      <div class="field">
        <label>Beta window start</label>
        <input type="date" id="f-beta-start" required>
      </div>
      <div class="field">
        <label>Beta window end</label>
        <input type="date" id="f-beta-end" required>
      </div>
    </div>
    <div class="field">
      <label>Opens to everyone on</label>
      <input type="date" id="f-open-beta">
      <div class="inline-check">
        <input type="checkbox" id="f-no-open-beta"><label for="f-no-open-beta">Stays invite-only the whole test</label>
      </div>
    </div>
    <div class="field">
      <label>Signup link</label>
      <input type="url" id="f-link" placeholder="https://">
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="f-description"></textarea>
    </div>
    <div class="field">
      <label>Source (your own recordkeeping, never shown publicly)</label>
      <input type="text" id="f-source" placeholder="https://">
    </div>
    <div class="field">
      <label>Fields still needing verification</label>
      <div class="review-check-group">
        <label><input type="checkbox" class="f-review" value="signup_open_date"> signup_open_date</label>
        <label><input type="checkbox" class="f-review" value="signup_deadline"> signup_deadline</label>
        <label><input type="checkbox" class="f-review" value="beta_window"> beta_window</label>
        <label><input type="checkbox" class="f-review" value="open_beta_date"> open_beta_date</label>
        <label><input type="checkbox" class="f-review" value="signup_link"> signup_link</label>
        <label><input type="checkbox" class="f-review" value="platform_access_type"> platform_access_type</label>
      </div>
    </div>
    <div class="form-actions">
      <button type="button" id="cancel-btn">Cancel</button>
      <button type="submit" class="primary">Save entry</button>
    </div>
  </form>
</dialog>

<script src="shared/data.js"></script>
<script src="shared/logic.js"></script>
<script>
let entries = JSON.parse(JSON.stringify(BETA_DATA));
let editingIndex = null;
const today = startOfToday();

const dialog = document.getElementById("entry-dialog");
const form = document.getElementById("entry-form");

function slugify(str) {
  return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}

let sortReviewFirst = false;

function effectiveReview(e) {
  // Once a beta has concluded, unverified fields aren't actionable anymore —
  // don't flag it for attention, even though the underlying data is untouched.
  if (computeStatus(e, today) === "concluded") return [];
  return e.needs_review || [];
}

function renderList() {
  const list = document.getElementById("entry-list");
  if (entries.length === 0) {
    list.innerHTML = `<p class="empty-state">No entries yet. Add one above.</p>`;
    return;
  }

  // Keep original array indices attached so edit/delete still target the right entry after sorting.
  let indexed = entries.map((e, i) => ({ e, i }));
  if (sortReviewFirst) {
    indexed = indexed.slice().sort((a, b) => effectiveReview(b.e).length - effectiveReview(a.e).length);
  }

  list.innerHTML = indexed.map(({ e, i }) => {
    const status = computeStatus(e, today);
    const review = effectiveReview(e);
    const reviewBadge = review.length > 0
      ? `<span class="review-badge">${review.length} to verify</span>`
      : `<span class="review-badge review-badge--clean">verified</span>`;
    const reviewChips = review.length > 0
      ? `<div class="review-fields">${review.map(f => `<span class="review-chip">${f}</span>`).join("")}</div>`
      : "";
    return `
      <div class="entry-row ${review.length > 0 ? 'entry-row--needs-review' : ''}">
        <div class="entry-row__info">
          <div class="entry-row__title">${e.title} <span class="status-badge status-${status}">${STATUS_LABEL[status]}</span>${reviewBadge}</div>
          <div class="entry-row__meta">${e.id} · ${e.platforms.join(", ")}</div>
          ${reviewChips}
        </div>
        <div class="entry-row__actions">
          <button data-edit="${i}">Edit</button>
          <button class="danger" data-delete="${i}">Delete</button>
        </div>
      </div>
    `;
  }).join("");

  list.querySelectorAll("[data-edit]").forEach(btn => {
    btn.addEventListener("click", () => openDialog(parseInt(btn.getAttribute("data-edit"))));
  });
  list.querySelectorAll("[data-delete]").forEach(btn => {
    btn.addEventListener("click", () => {
      const i = parseInt(btn.getAttribute("data-delete"));
      if (confirm(`Delete "${entries[i].title}"?`)) {
        entries.splice(i, 1);
        renderList();
      }
    });
  });
}

document.getElementById("sort-review-btn").addEventListener("click", (e) => {
  sortReviewFirst = !sortReviewFirst;
  e.target.textContent = sortReviewFirst ? "Sort: original order" : "Sort: needs review first";
  renderList();
});

function openDialog(index) {
  editingIndex = index;
  form.reset();
  document.querySelectorAll('[id^="f-platform-"]').forEach(cb => cb.checked = false);
  document.querySelectorAll('.f-review').forEach(cb => cb.checked = false);

  if (index === null) {
    document.getElementById("dialog-title").textContent = "Add entry";
  } else {
    const e = entries[index];
    document.getElementById("dialog-title").textContent = "Edit entry";
    document.getElementById("f-title").value = e.title;
    document.getElementById("f-id").value = e.id;
    e.platforms.forEach(p => {
      const cb = document.getElementById(`f-platform-${p}`);
      if (cb) cb.checked = true;
    });
    document.getElementById("f-access-type").value = e.platform_access_type || "unspecified";
    document.getElementById("f-signup-open").value = e.signup_open_date || "";
    document.getElementById("f-signup-deadline").value = e.signup_deadline || "";
    document.getElementById("f-no-deadline").checked = !e.signup_deadline;
    document.getElementById("f-beta-start").value = e.beta_window?.start || "";
    document.getElementById("f-beta-end").value = e.beta_window?.end || "";
    document.getElementById("f-open-beta").value = e.open_beta_date || "";
    document.getElementById("f-no-open-beta").checked = !e.open_beta_date;
    document.getElementById("f-link").value = e.signup_link || "";
    document.getElementById("f-description").value = e.description || "";
    document.getElementById("f-source").value = e.source || "";
    (e.needs_review || []).forEach(field => {
      const cb = document.querySelector(`.f-review[value="${field}"]`);
      if (cb) cb.checked = true;
    });
  }
  dialog.showModal();
}

document.getElementById("add-btn").addEventListener("click", () => openDialog(null));
document.getElementById("cancel-btn").addEventListener("click", () => dialog.close());

document.getElementById("f-title").addEventListener("input", (e) => {
  if (editingIndex === null) {
    document.getElementById("f-id").value = slugify(e.target.value);
  }
});

document.getElementById("f-no-deadline").addEventListener("change", (e) => {
  if (e.target.checked) document.getElementById("f-signup-deadline").value = "";
});
document.getElementById("f-no-open-beta").addEventListener("change", (e) => {
  if (e.target.checked) document.getElementById("f-open-beta").value = "";
});

form.addEventListener("submit", (evt) => {
  evt.preventDefault();
  const platforms = ["playstation", "xbox", "pc"].filter(p => document.getElementById(`f-platform-${p}`).checked);
  const needsReview = Array.from(document.querySelectorAll(".f-review:checked")).map(cb => cb.value);

  const entry = {
    id: document.getElementById("f-id").value.trim(),
    title: document.getElementById("f-title").value.trim(),
    platforms,
    platform_access_type: document.getElementById("f-access-type").value,
    signup_open_date: document.getElementById("f-signup-open").value,
    signup_deadline: document.getElementById("f-no-deadline").checked ? null : (document.getElementById("f-signup-deadline").value || null),
    beta_window: {
      start: document.getElementById("f-beta-start").value,
      end: document.getElementById("f-beta-end").value
    },
    open_beta_date: document.getElementById("f-no-open-beta").checked ? null : (document.getElementById("f-open-beta").value || null),
    signup_link: document.getElementById("f-link").value.trim() || null,
    description: document.getElementById("f-description").value.trim(),
    source: document.getElementById("f-source").value.trim(),
    needs_review: needsReview
  };

  if (editingIndex === null) {
    entries.push(entry);
  } else {
    entries[editingIndex] = entry;
  }
  dialog.close();
  renderList();
});

const FILE_HEADER = `/*
  BETA_DATA is the entire dataset, shared by every design (betatrainmodern,
  betatrainsteam, and any future ones). Never duplicate this file per design —
  add a design, point its index.html at this one via a relative path instead.

  Field reference:
    id                    unique slug
    title                 game title
    platforms             array of "playstation" | "xbox" | "pc"
    platform_access_type  "confirmed-simultaneous" | "selection-during-signup"
                           | "unspecified" — only meaningful when platforms.length > 1,
                           only set when you've actually verified it
    signup_open_date      "YYYY-MM-DD", the day signups start
    signup_deadline       "YYYY-MM-DD" or null if unknown / rolling admission
    beta_window           { start: "YYYY-MM-DD", end: "YYYY-MM-DD" }
    open_beta_date        "YYYY-MM-DD" or null. Most betas start invite-only and
                           open to everyone partway through the window — this is
                           that switchover date. Leave null if the beta stays
                           invite-only for its entire run, or if you haven't
                           confirmed whether/when it opens up.
    signup_link           url string or null if not yet available
    description           short blurb for the detail panel
    source                url you verified this against (recordkeeping only,
                           never shown publicly)
    needs_review           array of field names not yet confirmed from a source —
                           empty array means fully verified. Edit entries in
                           admin.html to check these off as you verify them.

  Generated by admin.html — paste this whole file over shared/data.js.
*/

const BETA_DATA = [
`;

function serializeEntries() {
  const body = entries.map(e => {
    return `  {
    id: ${JSON.stringify(e.id)},
    title: ${JSON.stringify(e.title)},
    platforms: ${JSON.stringify(e.platforms)},
    platform_access_type: ${JSON.stringify(e.platform_access_type)},
    signup_open_date: ${JSON.stringify(e.signup_open_date)},
    signup_deadline: ${e.signup_deadline ? JSON.stringify(e.signup_deadline) : "null"},
    beta_window: { start: ${JSON.stringify(e.beta_window.start)}, end: ${JSON.stringify(e.beta_window.end)} },
    open_beta_date: ${e.open_beta_date ? JSON.stringify(e.open_beta_date) : "null"},
    signup_link: ${e.signup_link ? JSON.stringify(e.signup_link) : "null"},
    description: ${JSON.stringify(e.description)},
    source: ${JSON.stringify(e.source || "")},
    needs_review: ${JSON.stringify(e.needs_review || [])}
  }`;
  }).join(",\n");
  return FILE_HEADER + body + "\n];\n";
}

document.getElementById("generate-btn").addEventListener("click", () => {
  const text = serializeEntries();
  document.getElementById("output").value = text;
  document.getElementById("output-section").hidden = false;
  document.getElementById("output-section").scrollIntoView({ behavior: "smooth" });
});

document.getElementById("copy-btn").addEventListener("click", () => {
  const ta = document.getElementById("output");
  ta.select();
  navigator.clipboard.writeText(ta.value).then(() => {
    const btn = document.getElementById("copy-btn");
    const original = btn.textContent;
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = original, 1500);
  });
});

document.getElementById("download-btn").addEventListener("click", () => {
  const blob = new Blob([document.getElementById("output").value], { type: "text/javascript" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "data.js";
  a.click();
  URL.revokeObjectURL(url);
});

renderList();
</script>
</body>
</html>
